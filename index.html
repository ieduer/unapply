      name="description"
      content="用減法從教育部 2026 名單的 2952 所普通高校中劃掉一定不考的那批。不做推薦，只做排除。"
    />
    <meta property="og:title" content="你一定不考 · 不考大學指南" />
    <meta property="og:description" content="不告訴你該考哪所，只幫你劃掉不能忍的那幾百所。" />

    <meta property="og:url" content="https://nope.bdfz.net/" />
    <meta property="og:image" content="https://nope.bdfz.net/media/background.jpeg" />
    <link rel="canonical" href="https://nope.bdfz.net/" />
    <!--
      字型（2026-11-12 批 H1）：字型樣式表不寫在這裡。src/lib/fontLoading.ts 會在首屏畫完、問卷資料下載結束後才插入
      （正文字體湖文明朝體用 mx.bdfz.net 的共用分片；省流量與 2G 連線不載），之前文字用系統字顯示。
      這裡只留預先連線與沒有 JavaScript 時的後備。改這一段前先讀 docs/MAINTENANCE_MANUAL.md §5.6。
    -->
    <link rel="preconnect" href="https://mx.bdfz.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <noscript>
      <link rel="stylesheet" href="https://mx.bdfz.net/fonts/huwen/v1/HuWenMingChao.4eeeeaf657.css" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      />
    </noscript>
    <!--
      語言字典提早下載（批 H2）：介面語言不是正體時，字典是首繪前一定要有的檔。主包跑起來才去抓會多一趟往返，
      所以在這裡就先發出請求，src/i18n/core.ts 的 loadLocale 會接手（語言與網址都相符才用）。
      判斷語言的規則必須與 core.ts 的 readStoredLocale／detectLocale 相同（tests/first-screen.test.ts 逐例比對）。
      %NOPE_I18N_VERSION% 由 vite.config.ts 在建置與開發伺服器輸出時換成 src/data/i18nManifest.ts 的版本。
    -->
    <script data-early-locale>
      (function () {
        try {
          var stored = null
          try { stored = window.localStorage.getItem('unapply.locale.v1') } catch (e) { stored = null }
          var locale = stored === 'zh-Hant' || stored === 'zh-Hans' || stored === 'en' ? stored : null
          if (!locale) {
            locale = 'zh-Hant'
            var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]
            for (var i = 0; i < list.length; i += 1) {
              var tag = String(list[i] || '').toLowerCase()
              if (!tag) continue
              if (/^zh(-hant|-tw|-hk|-mo)(-|$)/.test(tag)) { locale = 'zh-Hant'; break }
              if (/^zh(-hans|-cn|-sg)(-|$)/.test(tag)) { locale = 'zh-Hans'; break }
              if (/^en(-|$)/.test(tag)) { locale = 'en'; break }
              if (tag === 'zh') { locale = 'zh-Hant'; break }
            }
          }
          if (locale === 'zh-Hant' || typeof window.fetch !== 'function') return
          var url = '/i18n/' + locale + '.json?v=%NOPE_I18N_VERSION%'
          var promise = window.fetch(url, { credentials: 'same-origin' }).then(function (response) {
            if (!response.ok) throw new Error('early locale ' + response.status)
            return response.json()
          })
          promise.catch(function () {})
          window.__nopeEarlyLocale = { locale: locale, url: url, promise: promise }
        } catch (e) { /* 提早下載只是加速；任何問題都交回主包照常處理 */ }
      })()
    </script>
    <script
      defer
      src="https://my.bdfz.net/site-auth.js"
      data-mobile-inset-bottom="92"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
